<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Payment Form</title>
</head>
<body>
  <h1>Payment</h1>
  <form action="#" method="post">
    <p><label>Cardholder Name<br><input type="text" name="cardname" required></label></p>
    <p><label>Card Number<br><input type="text" name="cardnumber" required></label></p>
    <p><label>Expiry Date<br><input type="month" name="expiry" required></label></p>
    <p><label>CVV<br><input type="text" name="cvv" required></label></p>
    <p><button type="submit">Pay Now</button></p>
  </form>
</body>
</html>
