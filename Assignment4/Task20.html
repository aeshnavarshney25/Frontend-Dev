<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Head Elements Demo</title>
  <!-- meta tags provide metadata such as description and author -->
  <meta name="description" content="Demo of important head elements">
  <meta name="author" content="Aeshna Varshney">
  <!-- base sets the base URL for relative links -->
  <base href="/">
  <!-- link could point to a favicon (here just shown as example) -->
  <link rel="icon" href="favicon.ico">
  <!-- style can contain CSS; kept empty per instructions -->
  <style>
  </style>
  <!-- script can contain JavaScript; kept empty per instructions -->
  <script></script>
</head>
<body>
  <h1>Head Elements Explanation</h1>
  <p>Title: shown in browser tab.</p>
  <p>Meta: used for charset, description, author, viewport.</p>
  <p>Base: sets a base URL for relative links.</p>
  <p>Link: used to link external resources like favicon or stylesheets.</p>
  <p>Style: internal CSS rules.</p>
  <p>Script: JavaScript code or references.</p>
</body>
</html>
