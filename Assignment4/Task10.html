<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contact Form</title>
</head>
<body>
  <h1>Contact Us</h1>
  <form action="#" method="post">
    <p><label>Full Name<br><input type="text" name="name" placeholder="Your full name" required></label></p>
    <p><label>Email<br><input type="email" name="email" placeholder="you@example.com" required></label></p>
    <p><label>Subject<br><input type="text" name="subject" placeholder="Subject" required></label></p>
    <p><label>Message<br><textarea name="message" rows="5" placeholder="Your message" required></textarea></label></p>
    <p><button type="submit">Send</button></p>
  </form>
</body>
</html>
