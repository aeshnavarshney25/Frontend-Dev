<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Simple User Registration</title>
</head>
<body>
  <h1>User Registration</h1>
  <form action="#" method="post">
    <p><label>Full Name<br><input type="text" name="fullname" required></label></p>
    <p><label>Email Address<br><input type="email" name="email" required></label></p>
    <p><label>Password<br><input type="password" name="password" required></label></p>
    <p><label>Confirm Password<br><input type="password" name="confirm" required></label></p>
    <p><button type="submit">Register</button></p>
  </form>
</body>
</html>
