<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Form Security Demo</title>
</head>
<body>
  <h1>Secure Form Demo</h1>
  <form action="#" method="post" autocomplete="off">
    <p><label>Username<br><input type="text" name="username" required></label></p>
    <p><label>Password<br><input type="password" name="password" required></label></p>
    <p><button type="submit">Submit</button></p>
  </form>
  <p>Note: Turning off autocomplete prevents the browser from storing or suggesting form values, which can help reduce the risk of sensitive data being exposed on shared devices.</p>
</body>
</html>
