<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Filter Comparison Layout</title>
  <link rel="stylesheet" href="Filter-Comparison-Layout.css">
</head>
<body>
  <main class="compare">
    <figure class="side">
      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=900&q=60" alt="Original">
      <figcaption>Original</figcaption>
    </figure>

    <figure class="side">
      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=900&q=60" alt="Filtered" class="filtered">
      <figcaption>Filtered (brightness)</figcaption>
    </figure>
  </main>
</body>
</html>
