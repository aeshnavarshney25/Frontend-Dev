<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="Responsive-Image-Filter-Gallery.css">
</head>
<body>
  <header class="site-header">
    <h1>Image Filter Gallery</h1>
    <p class="lead">Hover an image to remove the filter (smooth transition).</p>
  </header>

  <main class="gallery">
    <figure>
      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=900&q=60" alt="Forest path">
      <figcaption>Grayscale</figcaption>
    </figure>

    <figure>
      <img src="https://images.unsplash.com/photo-1503023345310-bd7c1de61c7d?w=900&q=60" alt="Mountain sunrise">
      <figcaption>Sepia</figcaption>
    </figure>

    <figure>
      <img src="https://images.unsplash.com/photo-1496307042754-b4aa456c4a2d?w=900&q=60" alt="City skyline">
      <figcaption>Blur</figcaption>
    </figure>

    <figure>
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=900&q=60" alt="Sea horizon">
      <figcaption>Brightness</figcaption>
    </figure>

    <figure>
      <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=900&q=60" alt="Flower close-up">
      <figcaption>Contrast</figcaption>
    </figure>

    <figure>
      <img src="https://images.unsplash.com/photo-1504198453319-5ce911bafcde?w=900&q=60" alt="Desert dunes">
      <figcaption>Hue-rotate</figcaption>
    </figure>
  </main>

  <footer class="site-footer">Gallery — CSS filters demo</footer>
</body>
</html>
