<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CSS Transformations Showcase</title>
  <link rel="stylesheet" href="Task6.css">
</head>
<body>
  <header>
    <h1>CSS Transformations Showcase</h1>
    <p>Hover each box to activate the transform.</p>
  </header>
  <main>
    <section class="transforms">
      <div class="tile rotate">
        <div class="shape">Rotate</div>
        <div class="label">rotate()</div>
      </div>
      <div class="tile scale">
        <div class="shape">Scale</div>
        <div class="label">scale()</div>
      </div>
      <div class="tile translate">
        <div class="shape">Translate</div>
        <div class="label">translate()</div>
      </div>
      <div class="tile skew">
        <div class="shape">Skew</div>
        <div class="label">skew()</div>
      </div>
    </section>
  </main>
  <footer>
    <p>Transforms</p>
  </footer>
</body>
</html>
