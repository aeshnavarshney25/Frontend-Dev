<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shadows & Depth</title>
  <link rel="stylesheet" href="Task4.css">
</head>
<body>
  <header>
    <h1>Shadows & Depth</h1>
    <p>Three cards with varied shadow treatments and hover lift.</p>
  </header>

  <main>
    <section class="cards">
      <article class="card light">
        <h2>Soft Shadow</h2>
        <p>Subtle shadow for a gentle elevation.</p>
      </article>
      <article class="card medium">
        <h2>Medium Shadow</h2>
        <p>Stronger shadow for clearer separation.</p>
      </article>
      <article class="card strong">
        <h2>Strong Shadow</h2>
        <p>Deep shadow that lifts significantly on hover.</p>
      </article>
    </section>
  </main>

  <footer>
    <p>Shadows & Depth</p>
  </footer>
</body>
</html>
