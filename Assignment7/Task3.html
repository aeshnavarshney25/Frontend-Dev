<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gradient Backgrounds</title>
  <link rel="stylesheet" href="Task3.css">
</head>
<body>
  <header class="fixed-header">
    <h1>Gradient Backgrounds</h1>
  </header>

  <main>
    <section class="linear">
      <div class="inner">
        <h2>Linear Gradient</h2>
        <p>This section uses a CSS linear-gradient background.</p>
      </div>
    </section>

    <section class="radial">
      <div class="inner">
        <h2>Radial Gradient</h2>
        <p>This section uses a CSS radial-gradient background with background-attachment fixed to create a parallax-like effect.</p>
      </div>
    </section>
  </main>

  <footer class="fixed-footer">
    <p>Gradients</p>
  </footer>
</body>
</html>
