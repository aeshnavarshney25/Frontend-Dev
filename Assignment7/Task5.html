<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Advanced CSS Selectors</title>
  <link rel="stylesheet" href="Task5.css">
</head>
<body>
  <header>
    <h1>Advanced CSS Selectors</h1>
    <p>Examples: attribute selectors, pseudo-classes, pseudo-elements, and combinators.</p>
  </header>
  <main>
    <section>
      <h2>Form Inputs (attribute selectors)</h2>
      <form>
        <input type="text" placeholder="type=text matches [type=\"text\"]"><br>
        <input type="email" placeholder="type=email matches [type$=\"email\"]"><br>
        <a href="https://example.com">Secure link (starts with https)</a><br>
        <a href="http://example.com">Regular link</a>
      </form>
    </section>

    <section>
      <h2>List Demonstrations</h2>
      <ul class="items">
        <li>First item</li>
        <li>Second item</li>
        <li>Third item</li>
        <li>Fourth item</li>
      </ul>
    </section>
  </main>
  <footer>
    <p>Selectors</p>
  </footer>
</body>
</html>
