<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Outline & Focus Styling Form</title>
  <link rel="stylesheet" href="Task9.css">
</head>
<body>
  <header>
    <h1>Outline & Focus Styling Form</h1>
  </header>
  <main>
    <form class="sample-form" action="#" method="get">
      <label>
        Name
        <input type="text" name="name" placeholder="Your name">
      </label>
      <label>
        Email
        <input type="email" name="email" placeholder="you@example.com">
      </label>
      <label>
        Message
        <textarea name="message" rows="4" placeholder="Write a short message"></textarea>
      </label>
      <button type="submit">Send</button>
    </form>
  </main>
  <footer>
    <p>Form Focus</p>
  </footer>
</body>
</html>
