<!DOCTYPE html>
<html lang="en">
<head>

  <title>Dashboard Layout</title>

</head>
<body>
  <header class="dash-header">
    <h1>Admin Dashboard</h1>
  </header>
  <div class="dash-wrap">

      <nav>

          <li><a href="#">Overview</a></li>
