<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="BMICalculator.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚖️ BMI Calculator</h1>
            <p class="subtitle">Calculate your Body Mass Index</p>
        </header>

        <main>
            <form id="bmiForm" class="form-container">
                <div class="input-group">
                    <label for="weight">Weight (kg)</label>
                    <input type="number" id="weight" placeholder="Enter weight in kg" min="0" step="0.1" required>
                </div>

                <div class="input-group">
                    <label for="height">Height (m)</label>
                    <input type="number" id="height" placeholder="Enter height in meters" min="0" step="0.01" required>
                </div>

                <button type="submit" class="btn-calculate">Calculate BMI</button>
            </form>

            <!-- Results Section -->
            <div id="resultsSection" class="results-section hidden">
                <div class="results-card">
                    <h3>Your BMI Result</h3>
                    
                    <div class="bmi-display">
                        <span class="bmi-value" id="bmiValue">0</span>
                        <span class="bmi-label" id="bmiLabel">-</span>
                    </div>

                    <!-- BMI Category Progress Bar -->
                    <div class="progress-container">
                        <div class="progress-bar-labels">
                            <span>Underweight</span>
                            <span>Normal</span>
                            <span>Overweight</span>
                            <span>Obese</span>
                        </div>
                        
                        <div class="progress-bar">
                            <div id="progressIndicator" class="progress-indicator"></div>
                        </div>

                        <div class="bmi-ranges">
                            <p><span class="range-label underweight">BMI < 18.5</span> = Underweight</p>
                            <p><span class="range-label normal">18.5 - 24.9</span> = Normal Weight</p>
                            <p><span class="range-label overweight">25 - 29.9</span> = Overweight</p>
                            <p><span class="range-label obese">BMI ≥ 30</span> = Obese</p>
                        </div>
                    </div>

                    <!-- Details -->
                    <div class="details-box">
                        <p><strong>Weight:</strong> <span id="displayWeight">0</span> kg</p>
                        <p><strong>Height:</strong> <span id="displayHeight">0</span> m</p>
                        <p><strong>BMI:</strong> <span id="displayBMI">0</span></p>
                        <p><strong>Category:</strong> <span id="displayCategory">-</span></p>
                    </div>

                    <!-- Recommendation -->
                    <div id="recommendationBox" class="recommendation-box"></div>

                    <button type="reset" class="btn-reset" onclick="resetCalculator()">Calculate Again</button>
                </div>
            </div>

            <!-- Info Section
            <div class="info-section">
                <h3>What is BMI?</h3>
                <p>Body Mass Index (BMI) is a measure of body fat based on height and weight. The formula is:</p>
                <div class="formula">
                    <strong>BMI = weight (kg) / (height (m))²</strong>
                </div>
                <p>BMI is used as a general screening tool for weight categories. It's quick and easy to calculate using just height and weight.</p>
            </div> -->
        </main>

        <footer>
            <p>&copy; 2025 BMI Calculator | Fitness Wellness</p>
        </footer>
    </div>

    <script src="BMICalculator.js"></script>
</body>
</html>
