<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pricing</title>
  <link rel="stylesheet" href="Task5.css">
</head>
<body>
  <header class="wrap"><h1>Pricing</h1></header>
  <main class="wrap price-row">
    <div class="card small">
      <h2>Basic</h2>
      <p class="price">$9</p>
      <ul><li>Feature A</li><li>Feature B</li></ul>
      <a class="btn" href="#">Select</a>
    </div>
    <div class="card featured">
      <h2>Standard</h2>
      <p class="price">$19</p>
      <ul><li>Feature A</li><li>Feature B</li><li>Feature C</li></ul>
      <a class="btn" href="#">Select</a>
    </div>
    <div class="card small">
      <h2>Premium</h2>
      <p class="price">$29</p>
      <ul><li>All features</li><li>Priority support</li></ul>
      <a class="btn" href="#">Select</a>
    </div>
  </main>
</body>
</html>
