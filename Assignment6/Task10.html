<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flexbox & Grid Combined</title>
  <link rel="stylesheet" href="Task10.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="logo">StudioX</div>
      <nav class="menu"><a href="#">Home</a><a href="#">Blog</a><a href="#">Contact</a></nav>
    </div>
  </header>
  <main class="wrap grid-layout">
    <article class="article">
      <h1 class="animate">Article Title</h1>
      <div class="flex-boxes">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
      </div>
    </article>
    <aside class="sidebar">Sidebar content</aside>
  </main>
  <footer class="wrap footer">© 2025 </footer>
</body>
</html>
