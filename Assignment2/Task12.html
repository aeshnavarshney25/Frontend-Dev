<!DOCTYPE html>

</head>
<body>
     <!-- Creative paragraph combining inline elements -->

        I am <strong>passionate</strong> about web design and every project feels <em>fresh</em>.<br>
        Today I highlighted a <mark>bright idea</mark> that sparked new experiments. <small>Updated just now</small>
    </p>
</body>
</html>
